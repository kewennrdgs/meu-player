<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Catálogo com Retomada de Vídeo</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .current-title {
      font-size: 1.4rem;
      margin: 10px 0 20px 0;
      font-weight: 500;
      color: #e2e8f0;
    }

    /* --- NOTIFICAÇÃO: CONTINUAR DE ONDE PAROU --- */
    .resume-banner {
      display: none; /* Escondido por padrão */
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      animation: slideDown 0.3s ease;
    }
    .resume-banner.active {
      display: flex;
    }
    .resume-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #e2e8f0;
    }
    .resume-info strong {
      color: #60a5fa;
    }
    .resume-actions {
      display: flex;
      gap: 10px;
    }
    .btn-yes {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-yes:hover {
      background: #2563eb;
    }
    .btn-no {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-no:hover {
      background: #475569;
      color: #ffffff;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- PLAYER WRAPPER --- */
    .player-wrapper {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      background: #000;
      margin-bottom: 35px;
    }

    /* --- CONTROLES DE BUSCA E FILTRO --- */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }
    @media (min-width: 640px) {
      .controls-wrapper {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .search-input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      width: 100%;
      max-width: 320px;
    }
    .search-input:focus {
      border-color: #3b82f6;
    }
    .categories-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .category-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .category-btn.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* --- GRID --- */
    .catalog-title {
      font-size: 1.1rem;
      margin-bottom: 18px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }
    .movie-card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .movie-card:hover {
      transform: translateY(-6px);
      border-color: #64748b;
    }
    .movie-card.active {
      border-color: #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
    .movie-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
    }
    .movie-info {
      padding: 12px;
    }
    .movie-info h3 {
      margin: 0 0 4px 0;
      font-size: 0.9rem;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-tag {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
    }
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="movie-title" class="current-title">Carregando...</h1>

    <!-- BARRA DE PERGUNTA CONTINUAR ASSISTINDO -->
    <div id="resume-banner" class="resume-banner">
      <div class="resume-info">
        <span>Deseja continuar assistindo de onde parou em <strong id="resume-time-str">00:00</strong>?</span>
      </div>
      <div class="resume-actions">
        <button id="btn-resume-yes" class="btn-yes">Sim</button>
        <button id="btn-resume-no" class="btn-no">Não</button>
      </div>
    </div>
    
    <div class="player-wrapper">
      <video id="player" playsinline controls preload="metadata"></video>
    </div>

    <!-- BARRA DE BUSCA E FILTROS -->
    <div class="controls-wrapper">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por título..." />
      <div id="categories-filter" class="categories-filter"></div>
    </div>

    <h2 class="catalog-title">Catálogo</h2>
    <div id="movie-grid" class="movie-grid"></div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // LISTA DE FILMES
    const filmes = [
      {
        titulo: "Sobrenatural - Agora Entre Nós",
        categoria: "Terror",
        poster: "sobrenatural-capa.jpg",
        url: "https://archive.org/download/sobrenatural-agora-entre-nos/Sobrenatural%20-%20Agora%20entre%20n%C3%B3s.mp4"
      },
      {
        titulo: "A Queda 2",
        categoria: "Suspense",
        poster: "queda-capa.jpg",
        url: "https://SEU-LINK-DIRETO-2.mp4"
      }
    ];

    // Variáveis de Estado
    let filmeAtualIndex = 0;
    let categoriaSelecionada = 'Todas';
    let termoBusca = '';
    let tempoPendenteGuardado = 0;

    // Inicializa Player
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
      ratio: '16:9'
    });

    const grid = document.getElementById('movie-grid');
    const titleElement = document.getElementById('movie-title');
    const searchInput = document.getElementById('search-input');
    const categoriesContainer = document.getElementById('categories-filter');
    
    // Elementos do Banner
    const resumeBanner = document.getElementById('resume-banner');
    const resumeTimeStr = document.getElementById('resume-time-str');
    const btnYes = document.getElementById('btn-resume-yes');
    const btnNo = document.getElementById('btn-resume-no');

    // Chave única para o localStorage
    function getStorageKey(filme) {
      return `filme_progresso_${filme.titulo.replace(/\s+/g, '_').toLowerCase()}`;
    }

    // Função auxiliar para formatar segundos em MM:SS ou HH:MM:SS
    function formatarTempo(segundos) {
      const horas = Math.floor(segundos / 3600);
      const minutos = Math.floor((segundos % 3600) / 60);
      const segs = Math.floor(segundos % 60);

      const mStr = minutos < 10 && horas > 0 ? `0${minutos}` : `${minutos}`;
      const sStr = segs < 10 ? `0${segs}` : `${segs}`;

      if (horas > 0) {
        return `${horas}:${mStr}:${sStr}`;
      }
      return `${mStr}:${sStr}`;
    }

    function esconderBanner() {
      resumeBanner.classList.remove('active');
      tempoPendenteGuardado = 0;
    }

    // Carrega o filme selecionado
    function carregarFilme(index) {
      filmeAtualIndex = index;
      const filme = filmes[index];
      titleElement.textContent = filme.titulo;
      
      esconderBanner();

      player.source = {
        type: 'video',
        title: filme.titulo,
        poster: filme.poster,
        sources: [{ src: filme.url, type: 'video/mp4' }]
      };

      atualizarDestaqueCard();

      // Quando o vídeo estiver pronto para leitura de metadados
      player.once('loadeddata', () => {
        const tempoSalvo = localStorage.getItem(getStorageKey(filme));
        if (tempoSalvo) {
          const segundos = parseFloat(tempoSalvo);
          
          // Verifica se o tempo faz sentido (mais de 5s e faltam mais de 30s para o fim)
          if (segundos > 5 && (!player.duration || segundos < player.duration - 30)) {
            tempoPendenteGuardado = segundos;
            resumeTimeStr.textContent = formatarTempo(segundos);
            resumeBanner.classList.add('active');
          }
        }
      });
    }

    // Botão "SIM": vai para o tempo guardado e começa a reproduzir
    btnYes.addEventListener('click', () => {
      if (tempoPendenteGuardado > 0) {
        player.currentTime = tempoPendenteGuardado;
        player.play();
      }
      esconderBanner();
    });

    // Botão "NÃO": ignora e zera o registro de tempo salvo
    btnNo.addEventListener('click', () => {
      const filme = filmes[filmeAtualIndex];
      if (filme) {
        localStorage.removeItem(getStorageKey(filme));
      }
      esconderBanner();
    });

    // Grava continuamente no localStorage
    player.on('timeupdate', () => {
      if (filmes[filmeAtualIndex] && player.currentTime > 0) {
        const chave = getStorageKey(filmes[filmeAtualIndex]);
        localStorage.setItem(chave, player.currentTime.toString());
      }
    });

    function atualizarDestaqueCard() {
      document.querySelectorAll('.movie-card').forEach((card) => {
        const idx = parseInt(card.getAttribute('data-index'));
        if (idx === filmeAtualIndex) {
          card.classList.add('active');
        } else {
          card.classList.remove('active');
        }
      });
    }

    function renderizarGrid() {
      grid.innerHTML = '';

      const filmesFiltrados = filmes.filter((filme) => {
        const atendeCategoria = categoriaSelecionada === 'Todas' || filme.categoria === categoriaSelecionada;
        const atendeBusca = filme.titulo.toLowerCase().includes(termoBusca.toLowerCase());
        return atendeCategoria && atendeBusca;
      });

      if (filmesFiltrados.length === 0) {
        grid.innerHTML = `<div class="no-results">Nenhum filme encontrado.</div>`;
        return;
      }

      filmesFiltrados.forEach((filme) => {
        const indexOriginal = filmes.indexOf(filme);
        const card = document.createElement('div');
        card.className = `movie-card ${indexOriginal === filmeAtualIndex ? 'active' : ''}`;
        card.setAttribute('data-index', indexOriginal);
        card.innerHTML = `
          <img class="movie-poster" src="${filme.poster}" alt="${filme.titulo}" loading="lazy" />
          <div class="movie-info">
            <h3>${filme.titulo}</h3>
            <span class="movie-tag">${filme.categoria}</span>
          </div>
        `;
        card.onclick = () => carregarFilme(indexOriginal);
        grid.appendChild(card);
      });
    }

    function inicializarCategorias() {
      const categorias = ['Todas', ...new Set(filmes.map(f => f.categoria))];
      categoriesContainer.innerHTML = '';

      categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-btn ${cat === 'Todas' ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaSelecionada = cat;
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderizarGrid();
        };
        categoriesContainer.appendChild(btn);
      });
    }

    searchInput.addEventListener('input', (e) => {
      termoBusca = e.target.value;
      renderizarGrid();
    });

    // Inicialização do Catálogo
    inicializarCategorias();
    renderizarGrid();
    if (filmes.length > 0) {
      carregarFilme(0);
    }
  </script>
</body>
</html>
