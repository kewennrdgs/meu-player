<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CineApp</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineApp">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Player CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    /* --- RESET & UX NATIVA MOBILE --- */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }

    /* --- TOPO / APP BAR --- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .app-logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- HERO BANNER (DESTAQUE ESTILO NETFLIX) --- */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 260px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 20px;
      margin-bottom: 20px;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(11, 14, 20, 0.2) 0%, #0b0e14 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      background: #3b82f6;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 8px 0;
    }

    .btn-play-hero {
      background: #ffffff;
      color: #0b0e14;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* --- BARRA DE BUSCA E FILTROS --- */
    .section-controls {
      padding: 0 16px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
    }

    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.85rem;
      white-space: nowrap;
      font-weight: 500;
    }

    .category-chip.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* --- GRADE DE FILMES (MOBILE 2 COLUNAS) --- */
    .catalog-section {
      padding: 0 16px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #f1f5f9;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 600px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }

    .movie-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s active;
    }

    .movie-card:active {
      transform: scale(0.96);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background-color: #0f172a;
    }

    .movie-info {
      padding: 10px;
    }

    .movie-info h3 {
      margin: 0 0 4px 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-tag {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* --- PLAYER SCREEN (MODAL FULLSCREEN TIPO APP) --- */
    .player-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000000;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .player-modal.active {
      display: flex;
    }

    .player-header {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 1010;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-back {
      background: rgba(30, 41, 59, 0.8);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    .player-wrapper {
      width: 100%;
      max-height: 100vh;
      background: #000;
    }

    /* --- NOTIFICAÇÃO CONTINUAR ASSISTINDO --- */
    .resume-banner {
      display: none;
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 14px;
      margin: 0 16px 20px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .resume-banner.active {
      display: flex;
    }

    .resume-info {
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .resume-actions {
      display: flex;
      gap: 8px;
    }

    .btn-yes {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .btn-no {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    /* --- BARRA DE NAVEGAÇÃO INFERIOR (BOTTOM BAR) --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(11, 14, 20, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
      backdrop-filter: blur(10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748b;
      font-size: 0.75rem;
      text-decoration: none;
    }

    .nav-item.active {
      color: #3b82f6;
    }

    .nav-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="app-logo">
      <span>🎬</span> CineApp
    </div>
  </header>

  <!-- HERO BANNER DE DESTAQUE -->
  <div id="hero-banner" class="hero-banner">
    <div class="hero-content">
      <span id="hero-tag" class="hero-tag">Destaque</span>
      <h2 id="hero-title" class="hero-title">A Queda 2</h2>
      <button id="btn-play-hero" class="btn-play-hero">
        ▶ Assistir Agora
      </button>
    </div>
  </div>

  <!-- PERGUNTA CONTINUAR ASSISTINDO -->
  <div id="resume-banner" class="resume-banner">
    <div class="resume-info">
      Continuar de <strong id="resume-time-str">00:00</strong>?
    </div>
    <div class="resume-actions">
      <button id="btn-resume-yes" class="btn-yes">Sim</button>
      <button id="btn-resume-no" class="btn-no">Não</button>
    </div>
  </div>

  <!-- BUSCA E CATEGORIAS -->
  <div class="section-controls">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar filme ou série..." />
    <div id="categories-filter" class="categories-scroll"></div>
  </div>

  <!-- CATALOGO / GRADE DE FILMES -->
  <section class="catalog-section">
    <h3 class="section-title">Catálogo Completo</h3>
    <div id="movie-grid" class="movie-grid"></div>
  </section>

  <!-- PLAYER MODAL TELA CHEIA (ABRE COMO APP NATIVO) -->
  <div id="player-modal" class="player-modal">
    <div class="player-header">
      <button id="btn-close-player" class="btn-back">
        ← Voltar
      </button>
    </div>
    <div class="player-wrapper">
      <video id="player" playsinline controls preload="metadata"></video>
    </div>
  </div>

  <!-- NAVEGAÇÃO INFERIOR -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </a>
    <a href="#search-input" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Buscar</span>
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">⭐</span>
      <span>Catálogo</span>
    </a>
  </nav>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    // LISTA DE FILMES
    const filmes = [
      {
        titulo: "Sobrenatural - Agora Entre Nós",
        categoria: "Terror",
        poster: "sobrenatural-capa.jpg",
        url: "https://archive.org/download/sobrenatural-agora-entre-nos/Sobrenatural%20-%20Agora%20entre%20n%C3%B3s.mp4"
      },
      {
        titulo: "A Queda 2",
        categoria: "Suspense",
        poster: "queda-capa.jpg",
        url: "https://archive.org/download/a-queda-2/A%20queda%202.mp4"
      }
    ];

    let filmeAtualIndex = 0;
    let categoriaSelecionada = 'Todas';
    let termoBusca = '';
    let tempoPendenteGuardado = 0;

    // Inicializa Player
    const player = new Plyr('#player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
      ratio: '16:9'
    });

    const grid = document.getElementById('movie-grid');
    const searchInput = document.getElementById('search-input');
    const categoriesContainer = document.getElementById('categories-filter');
    const playerModal = document.getElementById('player-modal');
    const btnClosePlayer = document.getElementById('btn-close-player');
    
    // Banner e Hero
    const heroBanner = document.getElementById('hero-banner');
    const heroTitle = document.getElementById('hero-title');
    const heroTag = document.getElementById('hero-tag');
    const btnPlayHero = document.getElementById('btn-play-hero');

    const resumeBanner = document.getElementById('resume-banner');
    const resumeTimeStr = document.getElementById('resume-time-str');
    const btnYes = document.getElementById('btn-resume-yes');
    const btnNo = document.getElementById('btn-resume-no');

    function getStorageKey(filme) {
      return `filme_progresso_${filme.titulo.replace(/\s+/g, '_').toLowerCase()}`;
    }

    function formatarTempo(segundos) {
      const horas = Math.floor(segundos / 3600);
      const minutos = Math.floor((segundos % 3600) / 60);
      const segs = Math.floor(segundos % 60);
      const mStr = minutos < 10 && horas > 0 ? `0${minutos}` : `${minutos}`;
      const sStr = segs < 10 ? `0${segs}` : `${segs}`;
      return horas > 0 ? `${horas}:${mStr}:${sStr}` : `${mStr}:${sStr}`;
    }

    function esconderBanner() {
      resumeBanner.classList.remove('active');
      tempoPendenteGuardado = 0;
    }

    function abrirPlayer() {
      playerModal.classList.add('active');
    }

    function fecharPlayer() {
      player.pause();
      playerModal.classList.remove('active');
    }

    btnClosePlayer.addEventListener('click', fecharPlayer);

    // FUNÇÃO OTIMIZADA PARA TROCA RÁPIDA E SEM TRAVAMENTOS
    function carregarEIniciarFilme(index, autoPlay = true) {
      filmeAtualIndex = index;
      const filme = filmes[index];

      esconderBanner();

      // 1. Interrompe a reprodução anterior para limpar memória
      player.stop();

      // 2. Define a nova fonte no Plyr
      player.source = {
        type: 'video',
        title: filme.titulo,
        poster: filme.poster,
        sources: [{ src: filme.url, type: 'video/mp4' }]
      };

      if (autoPlay) {
        abrirPlayer();

        // 3. Executa a reprodução com tratamento de promessa
        const playPromise = player.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Previne falhas caso haja restrição de auto-play no navegador
          });
        }
      }

      // 4. Usa 'loadedmetadata' para verificar tempo salvo instantaneamente
      player.once('loadedmetadata', () => {
        const tempoSalvo = localStorage.getItem(getStorageKey(filme));
        if (tempoSalvo) {
          const segundos = parseFloat(tempoSalvo);
          if (segundos > 5 && (!player.duration || segundos < player.duration - 30)) {
            tempoPendenteGuardado = segundos;
            resumeTimeStr.textContent = formatarTempo(segundos);
            resumeBanner.classList.add('active');
          }
        }
      });
    }

    btnPlayHero.addEventListener('click', () => {
      carregarEIniciarFilme(0, true);
    });

    btnYes.addEventListener('click', () => {
      if (tempoPendenteGuardado > 0) {
        player.currentTime = tempoPendenteGuardado;
        abrirPlayer();
        player.play();
      }
      esconderBanner();
    });

    btnNo.addEventListener('click', () => {
      const filme = filmes[filmeAtualIndex];
      if (filme) {
        localStorage.removeItem(getStorageKey(filme));
      }
      esconderBanner();
    });

    player.on('timeupdate', () => {
      if (filmes[filmeAtualIndex] && player.currentTime > 0) {
        localStorage.setItem(getStorageKey(filmes[filmeAtualIndex]), player.currentTime.toString());
      }
    });

    function renderizarGrid() {
      grid.innerHTML = '';
      const filmesFiltrados = filmes.filter((filme) => {
        const atendeCategoria = categoriaSelecionada === 'Todas' || filme.categoria === categoriaSelecionada;
        const atendeBusca = filme.titulo.toLowerCase().includes(termoBusca.toLowerCase());
        return atendeCategoria && atendeBusca;
      });

      if (filmesFiltrados.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 20px;">Nenhum filme encontrado.</div>`;
        return;
      }

      filmesFiltrados.forEach((filme) => {
        const indexOriginal = filmes.indexOf(filme);
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img class="movie-poster" src="${filme.poster}" alt="${filme.titulo}" loading="lazy" />
          <div class="movie-info">
            <h3>${filme.titulo}</h3>
            <span class="movie-tag">${filme.categoria}</span>
          </div>
        `;
        card.onclick = () => carregarEIniciarFilme(indexOriginal, true);
        grid.appendChild(card);
      });
    }

    function inicializarCategorias() {
      const categorias = ['Todas', ...new Set(filmes.map(f => f.categoria))];
      categoriesContainer.innerHTML = '';

      categorias.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-chip ${cat === 'Todas' ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaSelecionada = cat;
          document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderizarGrid();
        };
        categoriesContainer.appendChild(btn);
      });
    }

    function atualizarHero() {
      if (filmes.length > 0) {
        const destaque = filmes[0];
        heroTitle.textContent = destaque.titulo;
        heroTag.textContent = destaque.categoria;
        heroBanner.style.backgroundImage = `url('${destaque.poster}')`;
      }
    }

    searchInput.addEventListener('input', (e) => {
      termoBusca = e.target.value;
      renderizarGrid();
    });

    // Inicialização
    atualizarHero();
    inicializarCategorias();
    renderizarGrid();

    // Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
